name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      # The Kaggle CSV isn't in git, so the full metric-reproduction test is skipped here;
      # the synthetic-score fingerprint test still checks the committed model.
      - name: Tests
        run: pytest -rs --cov=legitcheck --cov-report=term-missing

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t legitcheck-api .
      - name: Smoke test
        run: |
          docker run -d -p 7860:7860 --name api legitcheck-api
          for i in $(seq 1 30); do curl -fs localhost:7860/health && break; sleep 2; done
          curl -fs -X POST localhost:7860/check -H 'content-type: application/json' \
            -d '{"text":"Pay the registration fee of Rs 999 to confirm your seat today.","source":"api"}' \
            | grep -q '"verdict":"high_risk"'
