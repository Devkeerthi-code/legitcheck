<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LegitCheck extension popup · Design concept</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('lc-theme'); } catch (e) {}
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    if (window.self === window.top) document.documentElement.classList.add('standalone');
  })();
</script>
<style>
:root {
  --paper: #FFFFFF; --canvas: #F4F7F5; --surface: #FFFFFF;
  --ink: #0E2A22; --ink-2: #3D544B; --ink-3: #5A6E66; --line: #DDE5E1; --line-2: #C3D0CA; --rule: #EDF2EF;
  --accent: #1F4BD8; --accent-ink: #FFFFFF; --accent-soft: #E9EEFE;
  --high: #B42318; --high-bg: #FDECEA; --high-mark: #F8CEC8;
  --warn: #8A4B00; --warn-bg: #FFF4DE; --warn-mark: #FFDF9E;
  --ok: #17603F; --ok-bg: #E3F2EA;
  --font: "Geist", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, Consolas, monospace;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
  --dur-1: 120ms; --ease: cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1613; --canvas: #101B17; --surface: #14211C;
    --ink: #E6EFEA; --ink-2: #AFC2BA; --ink-3: #8FA59C; --line: #22342D; --line-2: #31473E; --rule: #18261F;
    --accent: #93AAFF; --accent-ink: #0A1433; --accent-soft: #1A2546;
    --high: #FF9585; --high-bg: #2E1714; --high-mark: #6A2A22;
    --warn: #F5C46E; --warn-bg: #2B2110; --warn-mark: #5E4515;
    --ok: #82D6A9; --ok-bg: #112A1E;
  }
}
:root[data-theme="dark"] {
  --paper: #0D1613; --canvas: #101B17; --surface: #14211C;
  --ink: #E6EFEA; --ink-2: #AFC2BA; --ink-3: #8FA59C; --line: #22342D; --line-2: #31473E; --rule: #18261F;
  --accent: #93AAFF; --accent-ink: #0A1433; --accent-soft: #1A2546;
  --high: #FF9585; --high-bg: #2E1714; --high-mark: #6A2A22;
  --warn: #F5C46E; --warn-bg: #2B2110; --warn-mark: #5E4515;
  --ok: #82D6A9; --ok-bg: #112A1E;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 400 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
html.standalone body { background: var(--canvas); display: grid; place-items: center; min-height: 100vh; height: auto; padding: 24px 12px; }
.popup { width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--paper); overflow: hidden; }
html.standalone .popup { width: min(360px, 100%); height: 560px; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 30px 60px -24px rgba(14,42,34,.28); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

.states { display: flex; gap: 2px; padding: 6px 8px; background: var(--ink); overflow-x: auto; scrollbar-width: none; }
.states span { font: 500 10px/1 var(--mono); color: color-mix(in oklab, var(--paper) 70%, var(--ink)); align-self: center; padding-right: 4px; white-space: nowrap; }
.states button { border: 0; background: transparent; color: var(--paper); font: 500 11px/1 var(--mono); padding: 6px 7px; border-radius: 6px; cursor: pointer; white-space: nowrap; opacity: .75; }
.states button[aria-pressed="true"] { background: color-mix(in oklab, var(--paper) 18%, transparent); opacity: 1; }

.top { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: -0.02em; font-size: 15px; }
.top .site { font: 500 11px/1 var(--mono); color: var(--ink-3); }

.body { flex: 1; overflow-y: auto; padding: 10px 14px 12px; display: grid; gap: 10px; align-content: start; }
.sel { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--canvas); padding: 10px 12px; }
.sel .k { display: flex; justify-content: space-between; font: 500 10.5px/1 var(--mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.sel p { margin: 0; font: 400 12px/1.6 var(--mono); color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sel mark { background: var(--high-mark); color: var(--ink); border-radius: 3px; padding: 0 1px; }
.sel mark.w { background: var(--warn-mark); }

.verdict { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; font: 600 13px/1 var(--font); white-space: nowrap; justify-self: start; will-change: transform; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip-high { color: var(--high); background: var(--high-bg); }
.chip-warn { color: var(--warn); background: var(--warn-bg); }
.chip-ok { color: var(--ok); background: var(--ok-bg); font-size: 12px; }
.score { text-align: right; font: 500 10.5px/1.3 var(--mono); color: var(--ink-3); }
.score b { display: block; font: 600 18px/1 var(--mono); color: var(--ink); }
.note { margin: 0; color: var(--ink-2); font-size: 12.5px; }

h2 { margin: 0 0 6px; font: 600 10.5px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.flags { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.flags li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; align-items: start; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); will-change: transform; }
.flags .n { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--high); color: var(--paper); font: 600 10px/1 var(--font); }
.flags .warn .n { background: var(--warn); }
:root[data-theme="dark"] .flags .n { color: #0D1613; }
.flags b { font-weight: 500; font-size: 13px; display: block; line-height: 1.3; }
.flags q { font: 400 11px/1.4 var(--mono); color: var(--ink-3); }

.open { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; border-radius: var(--r-md); background: var(--ink); color: var(--paper); text-decoration: none; font-weight: 500; transition: background-color var(--dur-1) var(--ease), transform var(--dur-1) var(--ease); }
.open:hover { background: color-mix(in oklab, var(--ink) 86%, var(--accent)); }
.open:active { transform: scale(.98); }

details { border: 1px solid var(--line); border-radius: var(--r-md); }
summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; font-weight: 500; font-size: 13px; }
summary::-webkit-details-marker { display: none; }
summary .pm { transition: transform 200ms cubic-bezier(.2,1.5,.3,1); }
details[open] summary .pm { transform: rotate(45deg); }
.checks { list-style: none; margin: 0; padding: 0 12px 10px; display: grid; gap: 4px; }
.checks label { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: start; font-size: 12.5px; color: var(--ink-2); cursor: pointer; padding: 3px 0; }
.checks input { margin: 2px 0 0; width: 16px; height: 16px; accent-color: var(--accent); }
.checks a { color: var(--accent); }

.foot { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11.5px; color: var(--ink-3); }
.foot a { color: var(--high); font-weight: 600; text-decoration: none; white-space: nowrap; }

.skel { display: grid; gap: 10px; }
.skel i { display: block; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--rule), var(--line), var(--rule)); background-size: 200% 100%; animation: shimmer 1.1s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.empty { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 28px 8px; color: var(--ink-2); }
.empty h3 { margin: 0; color: var(--ink); font-size: 16px; letter-spacing: -0.01em; }
.empty p { margin: 0; font-size: 13px; max-width: 30ch; }
.kbd { font: 500 11px/1 var(--mono); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; padding: 3px 6px; color: var(--ink); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></symbol>
    <symbol id="i-select" viewBox="0 0 24 24"><path d="M4 7V5a1 1 0 011-1h2M17 4h2a1 1 0 011 1v2M20 17v2a1 1 0 01-1 1h-2M7 20H5a1 1 0 01-1-1v-2M9 12h6"/></symbol>
  </defs>
</svg>
<div class="popup">
  <div class="states" role="group" aria-label="Concept preview state">
    <span>Concept state</span>
    <button type="button" data-state="high" aria-pressed="true">High risk</button>
    <button type="button" data-state="warn" aria-pressed="false">Warning</button>
    <button type="button" data-state="ok" aria-pressed="false">Consistent</button>
    <button type="button" data-state="loading" aria-pressed="false">Loading</button>
    <button type="button" data-state="empty" aria-pressed="false">Empty</button>
  </div>
  <header class="top">
    <span class="logo">
      <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--ink)"/><rect x="8" y="9" width="16" height="2.5" rx="1.25" fill="var(--paper)" opacity=".55"/><rect x="6.5" y="14.2" width="19" height="4.2" rx="1.4" fill="#FFDF9E"/><rect x="8" y="21" width="11" height="2.5" rx="1.25" fill="var(--paper)" opacity=".55"/></svg>
      LegitCheck
    </span>
    <span class="site" id="site">internshala.com</span>
  </header>
  <main class="body" id="body" aria-live="polite"></main>
  <footer class="foot">
    <span><svg class="icon" style="width:12px;height:12px;display:inline;vertical-align:-1px" aria-hidden="true"><use href="#i-lock"/></svg> Only selected text checked. Not stored.</span>
    <a href="tel:1930">Paid? Call 1930</a>
  </footer>
</div>
<script>
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var body = document.getElementById('body');
  var CHECKLIST = '<details><summary>Before you reply: 5 checks <svg class="icon pm" aria-hidden="true"><use href="#i-plus"/></svg></summary><ul class="checks">' +
    ['Find the company\'s official careers page', 'Never pay to get a job', 'Check the HR email domain', 'Search the company name + "scam"', 'Report at <a href="https://cybercrime.gov.in" target="_blank" rel="noopener">cybercrime.gov.in</a> or call 1930']
      .map(function (t) { return '<li><label><input type="checkbox"><span>' + t + '</span></label></li>'; }).join('') + '</ul></details>';
  var OPEN = '<a class="open" href="index.html#report" target="_top">Open full report <svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></a>';
  var STATES = {
    high: {
      site: 'internshala.com',
      sel: 'Pay a one-time <mark>registration fee of ₹1,999</mark> and <mark>send Aadhaar and PAN</mark>. <mark class="w">Contact HR on Telegram</mark> @nexora_hr_desk. Offer valid only today.',
      chip: ['chip-high', 'High risk'], score: '0.94', count: '6 warning signs',
      note: 'This matches common scam patterns. You decide what to do next.',
      flags: [['high', 'Asks you to pay a fee', 'registration fee of ₹1,999'], ['high', 'Wants Aadhaar/PAN early', 'send Aadhaar and PAN'], ['warn', 'HR only on Telegram', 'Contact HR on Telegram']]
    },
    warn: {
      site: 'linkedin.com',
      sel: 'We are hiring interns for our marketing team. Send your resume to <mark class="w">brightpath.hiring@gmail.com</mark>. <mark class="w">Limited seats</mark>, apply soon.',
      chip: ['chip-warn', 'Has warning signs'], score: '0.48', count: '2 warning signs',
      note: 'Some signs worth checking. Small companies sometimes do this too.',
      flags: [['warn', 'Personal email posing as a company', 'brightpath.hiring@gmail.com'], ['warn', 'Pressure to decide fast', 'Limited seats']]
    },
    ok: {
      site: 'mail.google.com',
      sel: 'Thank you for interviewing with Meridian Labs last Thursday. Your offer letter is attached. Please reply with any questions by Friday.',
      chip: ['chip-ok', 'Looks consistent with genuine postings'], score: '0.08', count: 'No warning signs found',
      note: 'No rule fired. That does not prove it is real, so still run the checks below.',
      flags: []
    }
  };
  function animateIn(els) {
    if (reduce) return;
    els.forEach(function (el, i) {
      var x = 0, v = 0, to = 1, k = 280, c = 20, last = performance.now(), delay = i * 70, t0 = last;
      el.style.opacity = '0';
      function step(now) {
        if (now - t0 < delay) { last = now; return requestAnimationFrame(step); }
        var dt = Math.min(0.032, (now - last) / 1000); last = now;
        v += (-k * (x - to) - c * v) * dt; x += v * dt;
        el.style.opacity = String(Math.min(1, x * 1.4));
        el.style.transform = 'translateY(' + ((1 - x) * 10).toFixed(2) + 'px)';
        if (Math.abs(v) < 0.005 && Math.abs(x - to) < 0.0005) { el.style.opacity = '1'; el.style.transform = 'none'; return; }
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }
  function stamp(el) {
    if (reduce) return;
    var x = 0, v = 0, last = performance.now();
    function step(now) {
      var dt = Math.min(0.032, (now - last) / 1000); last = now;
      v += (-320 * (x - 1) - 14 * v) * dt; x += v * dt;
      el.style.transform = 'scale(' + (1.35 - 0.35 * x).toFixed(3) + ') rotate(' + ((1 - x) * -4).toFixed(2) + 'deg)';
      if (Math.abs(v) < 0.005 && Math.abs(x - 1) < 0.0005) { el.style.transform = 'none'; return; }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  function render(state) {
    document.querySelectorAll('[data-state]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.state === state)); });
    if (state === 'loading') {
      body.innerHTML = '<div class="sel"><div class="k"><span>Selected text</span></div><div class="skel"><i></i><i style="width:85%"></i></div></div><div class="skel" aria-label="Checking"><i style="width:55%;height:30px;border-radius:999px"></i><i style="height:46px"></i><i style="height:46px"></i><i style="height:46px"></i></div>';
      return;
    }
    if (state === 'empty') {
      document.getElementById('site').textContent = 'no text selected';
      body.innerHTML = '<div class="empty"><svg class="icon" style="width:40px;height:40px;color:var(--accent)" aria-hidden="true"><use href="#i-select"/></svg><h3>Select an offer to check</h3><p>Highlight the message on the page, then right-click and choose <span class="kbd">Check with LegitCheck</span>.</p></div>' + OPEN.replace('Open full report', 'Paste text instead').replace('#report', '#check');
      animateIn(Array.prototype.slice.call(body.children));
      return;
    }
    var s = STATES[state];
    document.getElementById('site').textContent = s.site;
    var flags = s.flags.length ? '<section><h2>Top flags</h2><ol class="flags">' + s.flags.map(function (f, i) {
      return '<li class="' + f[0] + '"><span class="n" aria-hidden="true">' + (i + 1) + '</span><span><b>' + f[1] + '</b><q>' + f[2] + '</q></span></li>';
    }).join('') + '</ol></section>' : '';
    body.innerHTML =
      '<div class="sel"><div class="k"><span>Selected text</span><span>fictional</span></div><p>' + s.sel + '</p></div>' +
      '<div class="verdict"><span class="chip ' + s.chip[0] + '" id="chip"><span class="dot"></span>' + s.chip[1] + '</span><span class="score"><b>' + s.score + '</b>model score</span></div>' +
      '<p class="note"><strong>' + s.count + '.</strong> ' + s.note + '</p>' + flags + OPEN + CHECKLIST;
    stamp(document.getElementById('chip'));
    animateIn(Array.prototype.slice.call(body.querySelectorAll('.flags li')));
  }
  document.querySelectorAll('[data-state]').forEach(function (b) { b.addEventListener('click', function () { render(b.dataset.state); }); });
  window.addEventListener('message', function (e) {
    if (e.origin !== window.location.origin || !e.data || e.data.type !== 'lc-theme') return;
    if (e.data.theme === 'light' || e.data.theme === 'dark') document.documentElement.dataset.theme = e.data.theme;
  });
  render('high');
})();
</script>
</body>
</html>
